    source: tools/els/test_p1_001_process_interruption.py
    test_required: true
    interruption_target: "inside write operation before complete payload persistence"
oracle:
  output_states: [RECOVERABLE, INVALID, CONFLICT, UNKNOWN]
  deny_by_default: true
  decision_table:
    - condition: "repository identity cannot be established or is contradictory"
      result: CONFLICT
    - condition: "write boundary is not supported/evidenced"
      result: UNKNOWN
    - condition: "artifact is absent or state cannot be deterministically classified"
      result: UNKNOWN
    - condition: "persisted bytes exactly equal expected complete artifact and integrity succeeds"
      result: RECOVERABLE
    - condition: "persisted bytes are partial/corrupt and deterministic validation establishes invalid checkpoint state"
      result: INVALID
    - condition: "multiple authoritative identities or interpretations disagree"
      result: CONFLICT
    - condition: "none of the above can be established"
      result: UNKNOWN
required_evidence: [evidence_id, failure_class, environment, interruption_method, interruption_point, persisted_artifact, expected_recovery, evidence_boundary, repository, ref, engineering_head, controller_identity, target_identity, pre_interruption_checkpoint_identity, post_interruption_recovery_result, write_boundary, expected_artifact_identity, observed_artifact_identity, persisted_byte_length, parse_or_integrity_result, oracle_result, timestamp_or_run_id]
