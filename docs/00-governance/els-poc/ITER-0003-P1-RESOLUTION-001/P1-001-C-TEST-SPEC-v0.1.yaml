contract:
  id: ITER-0003-P1-RESOLUTION-001
  version: v0.2
  criterion: P1-001-C
  requirement: "Exercise partial/interrupted writes for each supported write boundary with deterministic classification."
engineering_identity:
  ref: els/iter-0003-p1-001-c-wb001-execution-001
  design_base_head: 31c406fd1264c54e702931134f6f7db14b494000
supported_boundary_inventory:
  - id: WB-001
    status: EVIDENCED_REFERENCE_BOUNDARY
    mechanism: single_file_write
    operation: "open checkpoint path for binary write -> write payload -> flush -> fsync"
    source: tools/els/test_p1_001_process_interruption.py
    test_required: true
    interruption_target: "inside write operation before complete payload persistence"
  - id: WB-002
    status: UNKNOWN
    mechanism: temporary_file_atomic_replace
    test_required: false
  - id: WB-003
    status: UNKNOWN
    mechanism: append
    test_required: false
  - id: WB-004
    status: UNKNOWN
