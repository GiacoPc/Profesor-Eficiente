name: Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            AI-GOVERNANCE.md
            PROJECT-CONSTITUTION.md
            PROJECT-STATE.yaml
            CONTEXT-MANIFEST.yaml
            DECISION-LEDGER.yaml
            README.md
            docs/ARCHITECTURE-BIBLE.md
            docs/00-governance/BASELINE-RECONCILIATION-v1.0.md
            docs/00-governance/ADR-POLICY.md
            docs/00-governance/TRACEABILITY.md
            docs/00-governance/CHANGE-CLASSIFICATION.md
            docs/00-governance/REPOSITORY-POLICY.md
            docs/00-governance/PGKI-1.0-SECOND-AUDIT.md
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.parse_file(f); puts "OK: #{f}" }' \
            PROJECT-STATE.yaml CONTEXT-MANIFEST.yaml DECISION-LEDGER.yaml

      - name: Governance invariants and state consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'offline_first: APPROVED' PROJECT-STATE.yaml
          grep -qF 'pedagogical_authority_outside_llm: APPROVED-DIRECTION' PROJECT-STATE.yaml
          grep -qF 'llm_provider_model: UNKNOWN' PROJECT-STATE.yaml
          grep -qF 'minimum_sufficient_context: true' CONTEXT-MANIFEST.yaml
          grep -qF 'repository_dump_per_task: false' CONTEXT-MANIFEST.yaml
          grep -qF 'missing_information: UNKNOWN' CONTEXT-MANIFEST.yaml
          grep -qF 'ci_governance_validation: VERIFIED' PROJECT-STATE.yaml
          grep -qF 'branch_protection: BLOCKED_BY_CURRENT_GITHUB_PLAN' PROJECT-STATE.yaml
          grep -qF 'second_audit: PASS_WITH_EXPLICIT_PLATFORM_EXCEPTION' PROJECT-STATE.yaml
          grep -qF 'state: READY_FOR_HUMAN_MERGE_REVIEW' PROJECT-STATE.yaml
          grep -qF 'required_fields: [id, decision, status, evidence, affected_artifacts]' DECISION-LEDGER.yaml
          ! grep -qF -- '- CONTEXT-MANIFEST.yaml' CONTEXT-MANIFEST.yaml
          echo 'Governance invariants and state consistency OK.'

      - name: Basic secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          pattern="AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|(?i)(api[_-]?key|secret[_-]?key|access[_-]?token)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+=-]{16,}"
          if git grep -nE "$pattern" -- . ':!docs/00-governance/BASELINE-RECONCILIATION-v1.0.md' ':!docs/00-governance/REPOSITORY-POLICY.md' ':!docs/00-governance/PGKI-1.0-SECOND-AUDIT.md'; then
            echo 'Potential credential material detected.'
            exit 1
          fi
          echo 'Basic secret hygiene OK.'

      - name: ELS checkpoint verifier regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/els/test_checkpoint_integrity_verifier.py

      - name: ELS continuity failure-control regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/els/test_continuity_controls.py

      - name: P1-001 CI identity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/els/test_ci_identity.py

      - name: P1-001 schema validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          text = Path('docs/00-governance/els-poc/ITER-0003-P1-RESOLUTION-001/P1-001-EVIDENCE-SCHEMA-v0.1.yaml').read_text(encoding='utf-8')
          required = [
              'evidence_id', 'failure_class', 'environment', 'interruption_method',
              'interruption_point', 'persisted_artifact', 'expected_recovery',
              'evidence_boundary', 'repository', 'ref', 'engineering_head',
              'execution_identity', 'observed_result', 'oracle_result', 'timestamp_or_run_id'
          ]
          for key in required:
              assert key in text, f'missing schema key: {key}'
          for value in ['PASS', 'FAIL', 'UNKNOWN', 'CONFLICT', 'RECOVERABLE', 'INVALID']:
              assert value in text, f'missing decision value: {value}'
          print(json.dumps({'schema_validation': 'PASS', 'required_fields': len(required)}))
          PY

      - name: P1-001 real controller-target SIGTERM test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/els/test_p1_001_process_interruption.py

      - name: P1-001-C WB-001 interrupted-write test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/els/test_p1_001_c_wb001_partial_write.py

      - name: Upload P1-001 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-001-process-and-partial-write-evidence
          path: artifacts/p1-001-*-evidence.json
          if-no-files-found: warn
